server {
    listen 80;
    server_name localhost; # Or your actual domain later
    
    resolver 127.0.0.11 valid=10s; # Docker's internal DNS resolver. Still important for stability.

    location / {
        # Set the target backend as a variable
        set $backend_service_url http://backend:8000; # 'backend' is your service name
        
        # Proxy all requests under / to the root of your backend service
        # So, a request to nginx's "/" will go to "http://backend:8000/"
        # A request to nginx's "/some/path" will go to "http://backend:8000/some/path"
        proxy_pass $backend_service_url;

        # Standard proxy headers to pass useful info to your FastAPI app
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
